services:
  db:
    image: postgres:16-alpine
    container_name: agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: agent_platform
    # No "ports:" on purpose: the database is only reachable from other containers.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: agent-platform:latest
    container_name: agent_backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/agent_platform
      CHROMA_PATH: /data/chroma
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      FREE_QUOTA: ${FREE_QUOTA:-100}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ALLOW_MOCK_LLM: ${ALLOW_MOCK_LLM:-true}
      ALLOW_SANDBOX_BILLING: ${ALLOW_SANDBOX_BILLING:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_STARTER: ${RAZORPAY_PLAN_STARTER:-}
      RAZORPAY_PLAN_PRO: ${RAZORPAY_PLAN_PRO:-}
    volumes:
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: agent-platform:latest        # same image as the backend, built once
    container_name: agent_frontend
    restart: unless-stopped
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000                                   # server-to-server (inside Docker)
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}       # shown in copy-paste snippets

volumes:
  postgres_data:
  chroma_data:
